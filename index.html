<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio | tinpro2k5</title>
    <meta
      name="description"
      content="Portfolio của tinpro2k5 được tạo từ dữ liệu GitHub."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card profile">
        <img id="avatar" class="avatar" alt="GitHub avatar" />
        <div>
          <h1 id="name">tinpro2k5</h1>
          <p id="bio">Đang tải thông tin GitHub...</p>
          <p><a id="github-link" target="_blank" rel="noopener noreferrer">GitHub Profile</a></p>
        </div>
      </section>

      <section class="card stats">
        <h2>GitHub Stats</h2>
        <div class="grid">
          <p><strong id="repo-count">0</strong><span>Repositories</span></p>
          <p><strong id="followers">0</strong><span>Followers</span></p>
          <p><strong id="following">0</strong><span>Following</span></p>
        </div>
      </section>

      <section class="card repositories">
        <h2>Featured Projects</h2>
        <ul id="repo-list">
          <li>Đang tải repositories...</li>
        </ul>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
